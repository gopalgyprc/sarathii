<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1458" />
      <stop offset="50%" stop-color="#2A0932" />
      <stop offset="100%" stop-color="#1A051F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#E6CFA5" />
      <stop offset="100%" stop-color="#D4AF6A" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF6A" />
      <stop offset="100%" stop-color="#A8823B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="170" height="170" rx="37" stroke="url(#goldStroke)" stroke-width="2.5" opacity="0.6" />

  <!-- Outer Celestial Chariot Ring -->
  <circle cx="90" cy="90" r="62" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.45" />
  <circle cx="90" cy="90" r="54" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.75" />

  <!-- 8 Sunray Spokes of the Chariot Wheel -->
  <line x1="90" y1="36" x2="90" y2="48" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="90" y1="132" x2="90" y2="144" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="36" y1="90" x2="48" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="132" y1="90" x2="144" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <line x1="52" y1="52" x2="60" y2="60" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="128" y1="128" x2="120" y2="120" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="128" y1="52" x2="120" y2="60" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="128" x2="60" y2="120" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Chariot Wheel Hub -->
  <circle cx="90" cy="90" r="38" fill="#350C3E" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Stylized Royal 'S' Monogram in Center -->
  <path d="M102 68 C102 68 80 62 76 74 C72 86 108 85 104 104 C100 118 78 114 78 114 M74 113 C74 113 96 119 100 107 C104 95 68 96 72 77 C76 63 98 67 98 67" 
        stroke="url(#goldGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" />

  <!-- Center Golden Star/Jewel -->
  <circle cx="90" cy="90" r="3.5" fill="#FFF3D6" />
</svg>